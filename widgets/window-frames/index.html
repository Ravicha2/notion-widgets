<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROWS vs RANGE</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1f2328;--mut:#6b7280;--line:#d0d5dc;--cell:#f3f4f6;--keep:#d1fae5;--keepb:#10b981;--mv:#f59e0b;--code:#f6f8fa;--hl:#fff3c4}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#e8e8e8;--mut:#9ca3af;--line:#3b3b3b;--cell:#262626;--keep:#064e3b;--keepb:#34d399;--mv:#fbbf24;--code:#202020;--hl:#4a3b10}}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1{font-size:15px;margin:0 0 10px;font-weight:600;letter-spacing:.02em}
.stage{overflow-x:auto;padding:2px 2px 4px}
.grid{display:grid;gap:5px;align-items:center;font-variant-numeric:tabular-nums;width:max-content}
.t{font-size:11px;color:var(--mut);text-align:center;white-space:nowrap}
.t.peer{color:var(--mv);text-decoration:underline dashed var(--mv);text-underline-offset:3px}
.ml{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--mut);text-align:right;padding-right:2px}
.cell{height:38px;border:2px solid var(--line);border-radius:7px;background:var(--cell);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;transition:background .2s,border-color .2s}
.cell.in{background:var(--keep);border-color:var(--keepb)}
.cell.cur{border-color:var(--mv);box-shadow:0 0 0 2px var(--mv)}
.ss{font-weight:700;text-align:right;white-space:nowrap}
.ss span{color:var(--mut);font-weight:400;font-size:12px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0}
button,select{font:inherit;color:inherit;background:var(--cell);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--mut)}button:disabled{opacity:.45;cursor:default}
.cnt{color:var(--mut);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}
.code{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:6px 0;overflow-x:auto;margin-top:10px;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.code div{padding:0 12px;white-space:pre}
</style></head><body>
<h1>ROWS vs RANGE</h1>
<div class="stage"><div class="grid" id="grid"></div></div>
<div class="ctl"><button id="prev" aria-label="Previous row">&#9664;</button><button id="play" aria-label="Play">&#9654;</button><button id="next" aria-label="Next row">&#9654;</button><button id="reset">Reset</button><select id="spd" aria-label="Speed"><option value="1400">Slow</option><option value="900" selected>Normal</option><option value="450">Fast</option></select><span class="cnt" id="cnt"></span></div>
<div class="code" id="code"></div>
<script>
var $=function(id){return document.getElementById(id)};
var D=[
  {id:1,t:'09:00',amt:100},
  {id:2,t:'09:05',amt:50},
  {id:3,t:'09:05',amt:70},
  {id:4,t:'09:10',amt:30},
  {id:5,t:'09:15',amt:20},
  {id:6,t:'09:20',amt:40}
];
var n=D.length,at=0,timer=null,rowCells=[],rangeCells=[],timeEls=[],rowSum,rangeSum;

function frames(i){
  var e=i;
  while(e+1<n&&D[e+1].t===D[i].t)e++;   // RANGE keeps scanning peers with the same ORDER BY value
  return {rows:[0,i],range:[0,e]};
}
function total(f){var s=0;for(var k=f[0];k<=f[1];k++)s+=D[k].amt;return s}

function build(){
  var g=$('grid');g.innerHTML='';rowCells=[];rangeCells=[];timeEls=[];
  g.style.gridTemplateColumns='56px repeat('+n+',46px) 54px';
  g.appendChild(el('div',''));
  D.forEach(function(r){var t=el('div','t',r.t);g.appendChild(t);timeEls.push(t)});
  g.appendChild(el('div',''));
  g.appendChild(el('div','ml','ROWS'));
  D.forEach(function(r){var c=el('div','cell',r.amt);g.appendChild(c);rowCells.push(c)});
  rowSum=el('div','ss');g.appendChild(rowSum);
  g.appendChild(el('div','ml','RANGE'));
  D.forEach(function(r){var c=el('div','cell',r.amt);g.appendChild(c);rangeCells.push(c)});
  rangeSum=el('div','ss');g.appendChild(rangeSum);
}
function el(tag,cls,txt){var d=document.createElement(tag);if(cls)d.className=cls;if(txt!==undefined)d.textContent=txt;return d}

function render(){
  var f=frames(at);
  [rowCells,rangeCells].forEach(function(cells,j){
    var fr=j===0?f.rows:f.range;
    cells.forEach(function(c,k){
      var cl='cell';
      if(k>=fr[0]&&k<=fr[1])cl+=' in';
      if(k===at)cl+=' cur';
      c.className=cl;
    });
  });
  rowSum.innerHTML='<span>=</span> '+total(f.rows);
  rangeSum.innerHTML='<span>=</span> '+total(f.range);
  timeEls.forEach(function(t,k){t.className='t'+(D[k].t===D[at].t?' peer':'')});
  $('cnt').textContent=(at+1)+' / '+n;
  $('prev').disabled=at===0;
  $('next').disabled=at===n-1;
  if(at===n-1)stop();
}

function stop(){if(timer){clearInterval(timer);timer=null}$('play').innerHTML='&#9654;'}
function play(){if(at===n-1){at=0;render()}stop();timer=setInterval(function(){if(at<n-1){at++;render()}else{stop()}},+$('spd').value);$('play').innerHTML='&#10074;&#10074;'}

['SUM(x) OVER (ORDER BY created_at, id','  ROWS  BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)','','SUM(x) OVER (ORDER BY created_at','  RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)'].forEach(function(t){
  var d=document.createElement('div');d.textContent=t;$('code').appendChild(d);
});

$('play').onclick=function(){if(timer){stop()}else{play()}};
$('next').onclick=function(){stop();if(at<n-1){at++;render()}};
$('prev').onclick=function(){stop();if(at>0){at--;render()}};
$('reset').onclick=function(){stop();at=0;render()};
$('spd').onchange=function(){if(timer)play()};

build();render();
</script></body></html>
